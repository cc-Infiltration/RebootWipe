name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        run: |
          msbuild RebootWipe.slnx /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Build succeeded."
        shell: powershell

      - name: Verify Build Output
        run: |
          $exe = Get-ChildItem -Path . -Recurse -Filter "RebootWipe.exe" |
                 Where-Object { $_.FullName -match "Release" } |
                 Select-Object -First 1
          if (-not $exe) {
              Write-Error "RebootWipe.exe not found in any Release output directory"
              exit 1
          }
          Write-Host "Verified: $($exe.FullName) ($([math]::Round($exe.Length / 1KB, 1)) KB)"
        shell: powershell

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RebootWipe-win-x64
          path: |
            **/Release/RebootWipe.exe
          if-no-files-found: error
