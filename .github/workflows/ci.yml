name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15

    env:
      CI: "true"
      REBOOTWIPE_SKIP_UAC: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-version: "17.0"

      - name: Build Release x64
        run: |
          msbuild RebootWipe.slnx /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Build succeeded."
        shell: powershell

      - name: Verify Build Output
        run: |
          $exePath = ".\RebootWipe\x64\Release\RebootWipe.exe"
          if (-not (Test-Path $exePath)) {
              Write-Error "Build output not found at $exePath"
              exit 1
          }
          $size = (Get-Item $exePath).Length
          Write-Host "Binary found: $exePath ($size bytes)"
        shell: powershell

      - name: Run Tests (Elevated)
        run: |
          $exePath = Resolve-Path ".\RebootWipe\x64\Release\RebootWipe.exe"
          $scriptPath = Resolve-Path ".\.github\scripts\run-tests.ps1"
          $logFile = Join-Path $env:GITHUB_WORKSPACE "test-results.log"

          Write-Host "Exe: $exePath"
          Write-Host "Script: $scriptPath"
          Write-Host "Log: $logFile"

          $isAdmin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)

          if ($isAdmin) {
              Write-Host "Current session is elevated. Running tests directly."
              & powershell.exe -ExecutionPolicy Bypass -NoProfile -File $scriptPath -ExePath $exePath -LogFile $logFile
              exit $LASTEXITCODE
          } else {
              Write-Host "Current session is NOT elevated. Launching elevated process..."
              $proc = Start-Process -FilePath "powershell.exe" `
                  -ArgumentList @(
                      "-ExecutionPolicy", "Bypass",
                      "-NoProfile",
                      "-File", $scriptPath,
                      "-ExePath", $exePath,
                      "-LogFile", $logFile
                  ) `
                  -Verb RunAs -Wait -PassThru
              Write-Host "Elevated process exited with code: $($proc.ExitCode)"
              exit $proc.ExitCode
          }
        shell: powershell

      - name: Upload Test Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.log
          if-no-files-found: ignore

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RebootWipe-win-x64
          path: RebootWipe/x64/Release/RebootWipe.exe
          if-no-files-found: error
